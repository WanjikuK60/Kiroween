# Render Blueprint for the "Deploy to my GitHub Pages" sign-in helper.
# Create it from the Render dashboard: New > Blueprint > pick this repo.
services:
  - type: web
    name: kiroween-deploy
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGIN
        value: https://wanjikuk60.github.io
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
